[workspace]
members = ["crates/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[profile.release]
lto = true
codegen-units = 1
# The wasm binary is meant to ship inside Cloudflare Workers bundles, whose size is capped.
opt-level = "s"
