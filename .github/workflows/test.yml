name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
      - name: Build the tool and the runtime
        run: |
          mvn -B install -DskipTests
          bun install --frozen-lockfile
          bun run build
      - name: Test the tool, and the runtime with ANTLR's runtime tests
        run: mvn -B test -pl runtime/Core,tool-testsuite,runtime-testsuite
      - name: Check that generated code is up to date
        run: |
          bun run generate
          git add --all
          git diff --cached --exit-code
      - name: Lint and test Rust
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Check and test TypeScript
        run: |
          bun run typecheck
          bun test
